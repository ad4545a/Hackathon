version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: transitops-db
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db

  mongo-init:
    image: mongo:6.0
    container_name: transitops-db-init
    depends_on:
      - mongodb
    entrypoint: [ "bash", "-c", "sleep 5 && mongosh --host mongodb --eval 'rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27017\"}]})'" ]

volumes:
  mongo_data:
